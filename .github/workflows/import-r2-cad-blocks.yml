name: Import CAD blocks from R2 staging
on:
  workflow_dispatch:
    inputs:
      package_asset:
        description: 'Release asset API URL of a blackline_ready ZIP (empty = R2 incoming/blackline_ready_package.zip)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - .github/workflows/import-r2-cad-blocks.yml
permissions:
  contents: read
concurrency:
  group: architecture-r2-sync
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ARCHITECTURE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ARCHITECTURE_R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.ARCHITECTURE_R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 ezdxf matplotlib Pillow
      - name: Build pinned DWG converter
        run: |
          docker build -t blackline-import-dwg dwg-converter
          docker run --rm -d --name blackline-import-dwg -p 127.0.0.1:8080:8080 blackline-import-dwg
      - name: Download package from a release asset
        if: ${{ inputs.package_asset != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ inputs.package_asset }}
        run: |
          case "$ASSET" in https://api.github.com/repos/${{ github.repository }}/releases/assets/*) ;; *) echo "::error::Asset must belong to this repository"; exit 1;; esac
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$ASSET" -o "$RUNNER_TEMP/package.zip"
          echo "PACKAGE_FILE=$RUNNER_TEMP/package.zip" >> "$GITHUB_ENV"
      - name: Import original files and render actual CAD previews
        run: python scripts/import-r2-cad-blocks.py
