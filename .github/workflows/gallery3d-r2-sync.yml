name: Publish 3D gallery assets to R2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cad3d-lab.js
      - assets/3d-object-library/v1/**
      - scripts/build-r2-3d-library.cjs
      - .github/workflows/gallery3d-r2-sync.yml
permissions:
  contents: read
concurrency:
  group: architecture-r2-sync
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ARCHITECTURE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ARCHITECTURE_R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.ARCHITECTURE_R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and rasterize thumbnails
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gallery3d"
          cp assets/3d-object-library/v1/* "$RUNNER_TEMP/gallery3d/"
          node scripts/build-r2-3d-library.cjs "$RUNNER_TEMP/gallery3d"
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import os, pathlib, cairosvg
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gallery3d'
          for svg in root.glob('cloud-detail-*.svg'):
              cairosvg.svg2png(url=str(svg),write_to=str(svg.with_suffix('.png')))
              svg.unlink()
          PY
      - name: Upload immutable library files; publish merged catalogue last
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing R2 access key}" "${AWS_SECRET_ACCESS_KEY:?Missing R2 secret}" "${R2_ACCOUNT:?Missing Cloudflare account}" "${R2_BUCKET:?Missing R2 bucket}"
          root="$RUNNER_TEMP/gallery3d"
          prefix="assets/3d-object-library/v1"
          endpoint="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          aws_r2() { aws --endpoint-url "$endpoint" "$@"; }
          if aws_r2 s3api head-object --bucket "$R2_BUCKET" --key "$prefix/catalog.json" > "$root/head.json" 2> "$root/head-error.txt"; then
            aws_r2 s3 cp "s3://$R2_BUCKET/$prefix/catalog.json" "$root/existing-catalog.json" --only-show-errors
          elif grep -Eq '404|Not Found|NoSuchKey' "$root/head-error.txt"; then
            echo '{"version":1,"items":[]}' > "$root/existing-catalog.json"
          else
            echo "::error::Cannot verify existing catalogue; aborting to prevent overwrite"
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gallery3d'
          merged={}
          for name in ('existing-catalog.json','catalog.json','generated-catalog.json'):
              data=json.loads((root/name).read_text())
              if data.get('version')!=1 or not isinstance(data.get('items'),list): raise ValueError(name)
              for row in data['items']: merged[row['id']]=row
          (root/'catalog.json').write_text(json.dumps(dict(version=1,items=list(merged.values())),ensure_ascii=False))
          PY
          for file in "$root"/cloud-*; do
            case "$file" in *.json) mime=application/json; cache=no-store;; *.png) mime=image/png; cache='public, max-age=3600';; *.svg) mime=image/svg+xml; cache='public, max-age=3600';; *) continue;; esac
            key="$prefix/$(basename "$file")"
            aws_r2 s3 cp "$file" "s3://$R2_BUCKET/$key" --content-type "$mime" --cache-control "$cache" --only-show-errors
            aws_r2 s3api head-object --bucket "$R2_BUCKET" --key "$key" --query ContentLength
          done
          aws_r2 s3 cp "$root/catalog.json" "s3://$R2_BUCKET/$prefix/catalog.json" --content-type application/json --cache-control no-cache --only-show-errors
          aws_r2 s3api head-object --bucket "$R2_BUCKET" --key "$prefix/catalog.json" --query ContentLength
          echo "R2 gallery published without deleting existing assets."
