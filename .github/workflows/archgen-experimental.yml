name: ARCHGEN experimental checks
on:
  push:
    branches: [archgen-modules-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cad-archgen.js
      - run: node --test tests/archgen-modules.test.cjs

      - name: Test ARCHGEN in Chromium
        run: node --test tests/archgen-browser.test.cjs
        env:
          ARCHGEN_SCREENSHOTS: archgen-previews
      - name: Upload CAD screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archgen-cad-previews
          path: archgen-previews/*.png
          if-no-files-found: warn
          retention-days: 14
