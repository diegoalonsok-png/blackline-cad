name: Archive licensed architecture references
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/collect-architecture-references.py
      - .github/workflows/architecture-reference-archive.yml
permissions:
  contents: write
concurrency:
  group: architecture-reference-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ezdxf>=1.3,<2' 'matplotlib>=3.8,<4'
      - run: python scripts/collect-architecture-references.py
      - name: Preserve verified originals and previews
        run: |
          git config user.name 'blackline-architecture[bot]'
          git config user.email 'blackline-architecture[bot]@users.noreply.github.com'
          git add assets/architecture-references
          if ! git diff --cached --quiet; then
            git commit -m "Archive licensed architectural references"
            git pull --rebase
            git push
          fi
