name: Sync architecture library to Cloudflare R2
on:
  workflow_dispatch:
  push:
    paths:
      - assets/arq-catalogue/v1/**
      - assets/architecture-references/**
      - .github/workflows/architecture-r2-sync.yml
  workflow_run:
    workflows: ["Archive licensed architecture references"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: architecture-r2-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ARCHITECTURE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ARCHITECTURE_R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.ARCHITECTURE_R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Upload assets and verify manifests
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "$AWS_ACCESS_KEY_ID" ]]; then
            echo "::error::Missing repository secret ARCHITECTURE_R2_ACCESS_KEY_ID"
            missing=1
          fi
          if [[ -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Missing repository secret ARCHITECTURE_R2_SECRET_ACCESS_KEY"
            missing=1
          fi
          if [[ -z "$R2_ACCOUNT" ]]; then
            echo "::error::Missing repository variable CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [[ -z "$R2_BUCKET" ]]; then
            echo "::error::Missing repository variable ARCHITECTURE_R2_BUCKET"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "R2 sync was not performed. Pages assets remain available."
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT}.r2.cloudflarestorage.com"
          for dir in assets/arq-catalogue/v1 assets/architecture-references; do
            test -s "$dir/index.json"
            aws --endpoint-url "$endpoint" s3 sync "$dir/" "s3://$R2_BUCKET/$dir/" --exclude index.json --only-show-errors
            aws --endpoint-url "$endpoint" s3 cp "$dir/index.json" "s3://$R2_BUCKET/$dir/index.json" --content-type application/json --cache-control no-cache --only-show-errors
            aws --endpoint-url "$endpoint" s3api head-object --bucket "$R2_BUCKET" --key "$dir/index.json" --query ContentLength
          done
