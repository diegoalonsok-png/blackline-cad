name: Blackline CAD regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cad-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript in index.html
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html','utf8');
          const inline = [...html.matchAll(/<script(\s[^>]*)?>([\s\S]*?)<\/script>/g)]
            .filter(x => x[2].trim());
          for(const [index, match] of inline.entries()){
            const attributes = match[1] || '';
            if(/\btype=["']application\/ld\+json["']/i.test(attributes)){
              JSON.parse(match[2]);
              continue;
            }
            new vm.Script(match[2], {filename: 'inline-' + index + '.js'});
          }
          console.log('Validated', inline.length, 'inline scripts and structured-data blocks');
          NODE
      - name: Run CAD geometry regression tests
        # Browser tests each launch Chromium; cap concurrent test files to avoid
        # resource contention on shared CI runners without skipping checks.
        run: node --test --test-concurrency=2 tests/*.test.cjs
