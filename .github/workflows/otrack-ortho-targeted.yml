name: OTRACK ORTHO targeted checks
on:
  push:
    branches: [fix-otrack-ortho-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/object-tracking.test.cjs tests/otrack-ortho-integration.test.cjs
