name: Import classified floor plans from R2 staging
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import-r2-plan-zip.py
permissions:
  contents: read
concurrency:
  group: architecture-r2-sync
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ARCHITECTURE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ARCHITECTURE_R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.ARCHITECTURE_R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 Pillow
      - run: python scripts/import-r2-plan-zip.py
