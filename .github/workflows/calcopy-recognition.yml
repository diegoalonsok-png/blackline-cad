name: CALCOPY recognition checks
on:
  pull_request:
    paths:
      - 'research/calcopy-v2/**'
      - 'assets/cad-calcopy-worker.js'
      - 'assets/cad-pdf-import.js'
      - '.github/workflows/calcopy-recognition.yml'
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s research/calcopy-v2 -p 'test_mixed.py' -v
      - run: node --check assets/cad-calcopy-worker.js && node --check assets/cad-pdf-import.js
